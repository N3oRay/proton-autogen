
name: Build Debian Package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build Debian (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove Microsoft repositories
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install --no-install-recommends -y \
            build-essential \
            devscripts \
            debhelper \
            fakeroot \
            python3 \
            python3-gi \
            python3-yaml \
            python3-rich \
            python3-requests \
            python3-psutil \
            python3-xlib \
            gir1.2-gtk-4.0 \
            gir1.2-graphene-1.0 \
            gir1.2-gdkpixbuf-2.0 \
            gir1.2-pango-1.0 \
            libglib2.0-dev \
            gobject-introspection

      - name: Build package
        run: |
          dpkg-buildpackage -b -us -uc

      - name: Move artifacts into workspace
        run: |
          mkdir -p dist
          mv ../proton-autogen_*.deb dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: proton-autogen-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error
