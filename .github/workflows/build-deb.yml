name: Build Debian Package

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build package
        run: |
          dpkg-deb --build . proton-autogen.deb

      - name: Install package (ignore dependency issues)
        run: |
          sudo dpkg -i proton-autogen.deb || true

      - name: Fix dependencies (non-blocking)
        run: |
          sudo apt-get update
          sudo apt-get install -f -y || true

      - name: Test CLI --version
        run: |
          proton-autogen --version

      - name: Test CLI --help
        run: |
          proton-autogen --help

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: proton-autogen
          path: proton-autogen.deb
