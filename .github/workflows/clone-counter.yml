
name: Clone Counter

on:
  schedule:
    - cron: "17 2 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-clones:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update clone statistics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_clone_stats.py

      - name: Commit statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add traffic/clones.json traffic/clones-badge.json

          if ! git diff --cached --quiet; then
            git commit -m "chore: update clone statistics"
            git push
          fi

