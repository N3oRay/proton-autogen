
name: Clone Counter

on:
  schedule:
    # Every day at 02:17 UTC
    - cron: "17 2 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clone-counter
  cancel-in-progress: false

jobs:
  update-clones:
    name: Update Lifetime Clone Statistics
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update clone statistics
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: python scripts/update_clone_stats.py

      - name: Commit and push statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add traffic/clones.json traffic/clones-badge.json

          if ! git diff --cached --quiet; then
            git commit -m "chore: update lifetime clone statistics"
            git push origin HEAD
          else
            echo "No statistics changes to commit."
          fi

