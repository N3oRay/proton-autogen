name: Build and Release Packages

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:

  workflow_dispatch:

permissions:
  contents: write

jobs:

  # ============================================================
  # Debian packages
  # ============================================================

  build-deb:
    name: Build Debian package (${{ matrix.ubuntu }})

    strategy:
      matrix:
        ubuntu:
          - ubuntu-22.04
          - ubuntu-24.04

    runs-on: ${{ matrix.ubuntu }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Debian packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            devscripts \
            debhelper \
            fakeroot \
            lintian

      - name: Build package
        run: |
          dpkg-buildpackage \
            -us \
            -uc \
            -b

      - name: List generated packages
        run: |
          ls -lh ../*.deb

      - name: Run lintian
        continue-on-error: true
        run: |
          lintian ../*.deb

      - name: Install generated package
        run: |
          sudo apt-get install -y ../*.deb

      - name: Verify installation
        run: |
          proton-autogen --help
          proton-autogen --version

      - name: Prepare artifact
        run: |
          mkdir -p artifacts
          cp ../*.deb artifacts/

      - name: Upload Debian artifact
        uses: actions/upload-artifact@v4
        with:
          name: proton-autogen-${{ matrix.ubuntu }}-deb
          path: artifacts/*.deb


  # ============================================================
  # Arch Linux package
  # ============================================================

  build-arch:
    name: Build (Arch / pacman)

    runs-on: ubuntu-latest

    if: startsWith(github.ref, 'refs/tags/v')

    container:
      image: archlinux:latest

    steps:

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm

          pacman -S --noconfirm \
            base-devel \
            git \
            python \
            python-build \
            python-installer \
            python-wheel \
            python-setuptools \
            python-gobject \
            python-pyyaml \
            python-rich \
            python-requests \
            python-psutil \
            gtk4 \
            gdk-pixbuf2 \
            graphene

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark workspace safe for git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Resolve version
        id: ver
        run: |
          V="${GITHUB_REF#refs/tags/v}"

          echo "VERSION=$V" >> "$GITHUB_OUTPUT"

          echo "Building Proton-Autogen version: $V"

      - name: Create CI PKGBUILD
        run: |
          V="${{ steps.ver.outputs.VERSION }}"

          cat > PKGBUILD.ci <<EOF
          pkgname=proton-autogen
          pkgver=$V
          pkgrel=1
          pkgdesc="Automatic Proton/Wine launcher for Windows executables"
          arch=('any')
          url="https://github.com/N3oRay/proton-autogen"
          license=('MIT')

          depends=(
              'python'
              'python-gobject'
              'python-pyyaml'
              'python-rich'
              'python-requests'
              'python-psutil'
              'gtk4'
              'gdk-pixbuf2'
              'graphene'
          )

          makedepends=(
              'python-build'
              'python-installer'
              'python-wheel'
              'python-setuptools'
          )

          build() {
              cd "\$startdir"

              python -m build --wheel --no-isolation

              echo "Checking wheel for UX assets..."

              python - <<'PY'
          import glob
          import zipfile
          import sys

          wheels = glob.glob("dist/*.whl")

          if not wheels:
              print("ERROR: no wheel found")
              sys.exit(1)

          wheel = wheels[0]

          with zipfile.ZipFile(wheel) as z:
              assets = [
                  name
                  for name in z.namelist()
                  if "/ux/assets/" in name
              ]

          if not assets:
              print("ERROR: wheel contains no UX assets")
              sys.exit(1)

          print(f"Found {len(assets)} UX asset files in {wheel}")

          for asset in assets[:20]:
              print(f"  {asset}")
          PY
          }

          package() {
              cd "\$startdir"

              python -m installer \
                  --destdir="\$pkgdir" \
                  dist/*.whl

              echo "Checking installed UX assets..."

              find \
                  "\$pkgdir/usr/lib/python"*"/site-packages/proton_autogen/ux/assets" \
                  -type f \
                  | sort

              install -Dm755 \
                  usr/bin/proton-autogen \
                  "\$pkgdir/usr/bin/proton-autogen"

              install -dm755 \
                  "\$pkgdir/usr/share/proton-autogen"

              cp -a \
                  usr/share/proton-autogen/. \
                  "\$pkgdir/usr/share/proton-autogen/"

              install -Dm644 \
                  usr/share/applications/proton-autogen.desktop \
                  "\$pkgdir/usr/share/applications/proton-autogen.desktop"

              install -Dm644 \
                  usr/share/icons/hicolor/256x256/apps/proton-autogen.png \
                  "\$pkgdir/usr/share/icons/hicolor/256x256/apps/proton-autogen.png"

              install -Dm644 \
                  usr/share/icons/hicolor/256x256/apps/proton-autogen.png \
                  "\$pkgdir/usr/share/icons/hicolor/256x256/apps/io.github.N3oRay.ProtonAutogen.png"

              install -Dm644 \
                  debian/proton-autogen.1.gz \
                  "\$pkgdir/usr/share/man/man1/proton-autogen.1.gz"

              install -Dm644 \
                  LICENSE \
                  "\$pkgdir/usr/share/licenses/proton-autogen/LICENSE"
          }
          EOF

          cp PKGBUILD.ci PKGBUILD

          echo "Generated PKGBUILD:"
          cat PKGBUILD

      - name: Build pacman package
        run: |
          useradd -m builder

          chown -R builder:builder "$GITHUB_WORKSPACE"

          su builder -c \
            "cd '$GITHUB_WORKSPACE' && makepkg -f --nodeps --noconfirm"

      - name: Inspect package
        run: |
          ls -lh ./*.pkg.tar.zst

          pacman -Qip ./*.pkg.tar.zst

      - name: Check package contents
        run: |
          pacman -Qlp ./*.pkg.tar.zst

      - name: Verify UX assets in package
        run: |
          echo "Checking packaged UX assets..."

          pacman -Qlp ./*.pkg.tar.zst \
            | grep 'proton_autogen/ux/assets/'

      - name: Prepare Arch artifact
        run: |
          mkdir -p dist

          cp ./*.pkg.tar.zst dist/

      - name: Upload Arch artifact
        uses: actions/upload-artifact@v4
        with:
          name: proton-autogen-arch
          path: dist/*.pkg.tar.zst


  # ============================================================
  # GitHub Release
  # ============================================================

  release:
    name: Publish GitHub Release

    needs:
      - build-deb
      - build-arch

    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-22.04

    steps:

      - name: Download Ubuntu 24.04 Debian package
        uses: actions/download-artifact@v4
        with:
          name: proton-autogen-ubuntu-24.04-deb
          path: release/deb

      - name: Download Arch package
        uses: actions/download-artifact@v4
        with:
          name: proton-autogen-arch
          path: release/arch

      - name: List release files
        run: |
          echo "Release files:"
          find release -type f -maxdepth 3 -print

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/deb/*.deb
            release/arch/*.pkg.tar.zst
