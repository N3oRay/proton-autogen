name: Build Arch Package

on:
  push:
    paths:
      - 'PKGBUILD'
      - '.github/workflows/arch-package.yml'
  pull_request:
    paths:
      - 'PKGBUILD'
      - '.github/workflows/arch-package.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PKGVER: 3.2.4

    container:
      image: archlinux:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update Arch Linux
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm archlinux-keyring

      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm \
            archlinux-keyring \
            base-devel \
            curl \
            git \
            namcap \
            pacman-contrib \
            python \
            python-build \
            python-installer \
            python-wheel \
            python-setuptools \
            python-gobject \
            python-pyyaml \
            python-rich \
            gtk4 \
            gdk-pixbuf2 \
            glib2 \
            cairo \
            pango

      - name: Create build user
        run: |
          useradd -m builder
      - name: Generate source checksum
        run: |
          curl -L \
            -o v${{ env.PKGVER }}.tar.gz \
            https://github.com/N3oRay/proton-autogen/archive/refs/tags/v${{ env.PKGVER }}.tar.gz

          sha256sum v${{ env.PKGVER }}.tar.gz

      - name: Build package
        run: |
          chown -R builder:builder .
          su builder -c "makepkg --nodeps --force --noconfirm"

      - name: Check package integrity
        run: |
          namcap *.pkg.tar.zst

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: proton-autogen-package
          path: "*.pkg.tar.zst"

      - name: Verify package content
        run: |
          tar -tf *.pkg.tar.zst | grep proton_autogen

      - name: Install package
        run: |
          pacman -U --noconfirm *.pkg.tar.zst

      - name: Test binary version
        run: |
          proton-autogen --version
      - name: Test binary help
        run: |
          proton-autogen --help

      - name: List package files
        run: |
          pacman -Ql proton-autogen

      - name: Uninstall package
        run: |
          pacman -Rns --noconfirm proton-autogen

      - name: Verify uninstall
        run: |
          test ! -e /usr/bin/proton-autogen
