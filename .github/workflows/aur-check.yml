name: AUR Package Check

on:
  push:
    branches:
      - main
    paths:
      - 'PKGBUILD'
      - '.SRCINFO'
      - 'pyproject.toml'
      - 'usr/**'
      - 'debian/**'
      - '.github/workflows/aur-check.yml'

  pull_request:
    paths:
      - 'PKGBUILD'
      - '.SRCINFO'
      - 'pyproject.toml'
      - 'usr/**'
      - 'debian/**'
      - '.github/workflows/aur-check.yml'

  workflow_dispatch:

jobs:
  aur-check:
    name: Build and validate AUR package
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Arch Linux
        run: |
          pacman -Syu --noconfirm

      - name: Install packaging tools
        run: |
          pacman -S --needed --noconfirm \
            base-devel \
            git \
            namcap \
            python \
            python-build \
            python-installer \
            python-setuptools \
            python-wheel

      - name: Check PKGBUILD syntax
        run: |
          bash -n PKGBUILD

      - name: Validate PKGBUILD
        run: |
          namcap PKGBUILD

      - name: Verify package version consistency
        shell: bash
        run: |
          set -euo pipefail

          PKGVER=$(sed -n 's/^pkgver=//p' PKGBUILD)
          PROJECT_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)

          echo "PKGBUILD version:       $PKGVER"
          echo "pyproject.toml version: $PROJECT_VERSION"

          test -n "$PKGVER"
          test -n "$PROJECT_VERSION"

          if [[ "$PKGVER" != "$PROJECT_VERSION" ]]; then
            echo "ERROR: PKGBUILD and pyproject.toml versions differ."
            exit 1
          fi

          git fetch --tags --force

          TAG="v${PKGVER}"

          echo "Required Git tag: $TAG"

          if ! git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "ERROR: Git tag ${TAG} does not exist."
            exit 1
          fi

          echo "Version consistency: OK"

      - name: Verify source tag
        run: |
          grep -q 'archive/refs/tags/v${pkgver}.tar.gz' PKGBUILD

      - name: Regenerate .SRCINFO
        run: |
          makepkg --printsrcinfo > .SRCINFO.generated

      - name: Compare .SRCINFO
        run: |
          diff -u .SRCINFO .SRCINFO.generated

      - name: Build package
        run: |
          makepkg --clean --syncdeps --noconfirm

      - name: Find generated package
        run: |
          ls -lh *.pkg.tar.*

      - name: Validate built package
        run: |
          namcap *.pkg.tar.*

      - name: Inspect package contents
        run: |
          pacman -Qlp *.pkg.tar.*

      - name: Verify required files
        run: |
          PACKAGE=$(find . -maxdepth 1 -name '*.pkg.tar.*' -print -quit)

          echo "Checking package: $PACKAGE"

          pacman -Qlp "$PACKAGE" | grep -q '/usr/bin/proton-autogen$'
          pacman -Qlp "$PACKAGE" | grep -q '/usr/share/applications/proton-autogen.desktop$'
          pacman -Qlp "$PACKAGE" | grep -q '/usr/share/man/man1/proton-autogen.1.gz$'
          pacman -Qlp "$PACKAGE" | grep -q '/usr/share/licenses/proton-autogen/LICENSE$'

      - name: Install built package
        run: |
          PACKAGE=$(find . -maxdepth 1 -name '*.pkg.tar.*' -print -quit)

          pacman -U --noconfirm "$PACKAGE"

      - name: Verify installed files
        run: |
          test -x /usr/bin/proton-autogen
          test -f /usr/share/applications/proton-autogen.desktop
          test -f /usr/share/man/man1/proton-autogen.1.gz
          test -f /usr/share/licenses/proton-autogen/LICENSE

      - name: Verify executable
        run: |
          proton-autogen --help

      - name: Verify Python module
        run: |
          python -c "import proton_autogen; print(proton_autogen)"

      - name: Verify package ownership
        run: |
          pacman -Qo /usr/bin/proton-autogen
          pacman -Qo /usr/share/applications/proton-autogen.desktop

      - name: Check package metadata
        run: |
          pacman -Qi proton-autogen

      - name: Check repository state
        run: |
          git status --short
