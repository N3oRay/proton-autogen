name: AUR Package Check

on:
  push:
    branches:
      - main
    paths:
      - 'PKGBUILD'
      - '.SRCINFO'
      - 'pyproject.toml'
      - 'usr/**'
      - 'debian/**'
      - '.github/workflows/aur-check.yml'

  pull_request:
    paths:
      - 'PKGBUILD'
      - '.SRCINFO'
      - 'pyproject.toml'
      - 'usr/**'
      - 'debian/**'
      - '.github/workflows/aur-check.yml'

  workflow_dispatch:

jobs:
  aur-check:
    name: Build and validate AUR package
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update Arch Linux
        run: |
          pacman -Syu --noconfirm

      - name: Install packaging tools
        run: |
          pacman -S --needed --noconfirm \
            base-devel \
            curl \
            git \
            namcap \
            python \
            python-build \
            python-installer \
            python-setuptools \
            python-wheel

      - name: Create build user
        run: |
          useradd --create-home --shell /bin/bash builder

          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Check PKGBUILD syntax
        run: |
          bash -n PKGBUILD

      - name: Validate PKGBUILD
        run: |
          namcap PKGBUILD

      - name: Verify package version consistency
        shell: bash
        run: |
          set -euo pipefail

          PKGVER=$(sed -n 's/^pkgver=//p' PKGBUILD)
          PROJECT_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)

          echo "PKGBUILD version:       $PKGVER"
          echo "pyproject.toml version: $PROJECT_VERSION"

          if [[ -z "$PKGVER" ]]; then
            echo "ERROR: pkgver is missing from PKGBUILD."
            exit 1
          fi

          if [[ -z "$PROJECT_VERSION" ]]; then
            echo "ERROR: version is missing from pyproject.toml."
            exit 1
          fi

          if [[ "$PKGVER" != "$PROJECT_VERSION" ]]; then
            echo "ERROR: PKGBUILD and pyproject.toml versions differ."
            exit 1
          fi

          TAG="v${PKGVER}"

          echo "Checking GitHub tag: $TAG"

          curl \
            --fail \
            --silent \
            --show-error \
            "https://api.github.com/repos/N3oRay/proton-autogen/git/ref/tags/${TAG}" \
            >/dev/null

          echo "GitHub tag ${TAG}: OK"
          echo "Version consistency: OK"

      - name: Verify source URL
        run: |
          if ! grep -q 'archive/refs/tags/v${pkgver}.tar.gz' PKGBUILD; then
            echo "ERROR: PKGBUILD source does not use v\${pkgver}.tar.gz."
            exit 1
          fi

          echo "Source URL: OK"

      - name: Verify source checksum
        run: |
          grep -q '^sha256sums=' PKGBUILD

          echo "sha256sums: present"

      - name: Regenerate .SRCINFO
        run: |
          su builder -c 'cd "$GITHUB_WORKSPACE" && makepkg --printsrcinfo' \
            > .SRCINFO.generated

      - name: Compare .SRCINFO
        run: |
          diff -u .SRCINFO .SRCINFO.generated

          echo ".SRCINFO: synchronized with PKGBUILD"

      - name: Build package
        run: |
          su builder -c '
            cd "$GITHUB_WORKSPACE"

            makepkg \
              --clean \
              --syncdeps \
              --noconfirm
          '

      - name: Find generated package
        run: |
          PACKAGE=$(find . -maxdepth 1 -type f -name '*.pkg.tar.*' -print -quit)

          if [[ -z "$PACKAGE" ]]; then
            echo "ERROR: No package was generated."
            exit 1
          fi

          echo "Generated package:"
          ls -lh "$PACKAGE"

      - name: Validate built package with namcap
        run: |
          PACKAGE=$(find . -maxdepth 1 -type f -name '*.pkg.tar.*' -print -quit)

          namcap "$PACKAGE"

      - name: Inspect package contents
        run: |
          PACKAGE=$(find . -maxdepth 1 -type f -name '*.pkg.tar.*' -print -quit)

          echo "Package contents:"
          pacman -Qlp "$PACKAGE"

      - name: Verify required files
        run: |
          set -euo pipefail

          PACKAGE=$(find . -maxdepth 1 -type f -name '*.pkg.tar.*' -print -quit)

          REQUIRED_FILES=(
            '/usr/bin/proton-autogen'
            '/usr/share/applications/proton-autogen.desktop'
            '/usr/share/man/man1/proton-autogen.1.gz'
            '/usr/share/licenses/proton-autogen/LICENSE'
          )

          for file in "${REQUIRED_FILES[@]}"; do
            if ! pacman -Qlp "$PACKAGE" | grep -q "${file}$"; then
              echo "ERROR: Missing required file: $file"
              exit 1
            fi

            echo "Found: $file"
          done

          echo "Required files: OK"

      - name: Install built package
        run: |
          PACKAGE=$(find . -maxdepth 1 -type f -name '*.pkg.tar.*' -print -quit)

          pacman -U --noconfirm "$PACKAGE"

      - name: Verify installed files
        run: |
          set -euo pipefail

          test -x /usr/bin/proton-autogen
          test -f /usr/share/applications/proton-autogen.desktop
          test -f /usr/share/man/man1/proton-autogen.1.gz
          test -f /usr/share/licenses/proton-autogen/LICENSE

          echo "Installed files: OK"

      - name: Verify executable
        run: |
          proton-autogen --help

      - name: Verify Python module
        run: |
          python -c "import proton_autogen; print(proton_autogen)"

      - name: Verify package ownership
        run: |
          pacman -Qo /usr/bin/proton-autogen
          pacman -Qo /usr/share/applications/proton-autogen.desktop

      - name: Check package metadata
        run: |
          pacman -Qi proton-autogen

      - name: Check repository state
        run: |
          git status --short
