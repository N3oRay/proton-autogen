name: Multi-distro Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debian:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Disable broken Microsoft repositories
        run: |
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list

      - name: Install Debian dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            python3 \
            python3-gi \
            python3-gi-cairo \
            python3-yaml \
            python3-rich \
            gir1.2-gtk-4.0 \
            gir1.2-glib-2.0 \
            libgtk-4-1 \
            gobject-introspection \
            python3-pytest

      - name: Install project (system-style)
        run: |
          sudo install -Dm755 usr/bin/proton-autogen /usr/bin/proton-autogen

          sudo mkdir -p /usr/share/proton-autogen
          sudo cp -r usr/share/proton-autogen/* /usr/share/proton-autogen/ || true

          sudo mkdir -p /usr/lib/python3/dist-packages/proton_autogen
          sudo cp -r usr/lib/python3/dist-packages/proton_autogen \
            /usr/lib/python3/dist-packages/

      - name: Run gamescope tests only
        run: |
          export PYTHONPATH=/usr/lib/python3.*/site-packages
          export PATH=/usr/bin:$PATH
          python -m pytest tests/test_gamescope.py -v

      - name: Run tests
        run: |
          export PYTHONPATH=/usr/lib/python3/dist-packages
          export PATH=/usr/bin:$PATH
          python3 -m pytest -v


  arch:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Arch dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            python \
            python-gobject \
            python-yaml \
            python-rich \
            gtk4 \
            glib2 \
            pango \
            cairo \
            gobject-introspection \
            python-pytest

      - name: Install project (system-style)
        run: |
          install -Dm755 usr/bin/proton-autogen /usr/bin/proton-autogen

          mkdir -p /usr/share/proton-autogen
          cp -r usr/share/proton-autogen/* /usr/share/proton-autogen/ || true

          mkdir -p /usr/lib/python3.*/site-packages/proton_autogen
          cp -r usr/lib/python3/dist-packages/proton_autogen \
            /usr/lib/python3.*/site-packages/

      - name: Run gamescope tests only
        run: |
          export PYTHONPATH=/usr/lib/python3.*/site-packages
          export PATH=/usr/bin:$PATH
          python -m pytest tests/test_gamescope.py -v

      - name: Run tests
        run: |
          export PYTHONPATH=/usr/lib/python3.*/site-packages
          export PATH=/usr/bin:$PATH
          python -m pytest -v


  fedora:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Fedora dependencies
        run: |
          dnf install -y \
            python3 \
            python3-gobject \
            python3-pyyaml \
            python3-rich \
            pango \
            cairo \
            gtk4 \
            glib2 \
            gobject-introspection \
            python3-pytest

      - name: Install project (system-style)
        run: |
          install -Dm755 usr/bin/proton-autogen /usr/bin/proton-autogen

          mkdir -p /usr/share/proton-autogen
          cp -r usr/share/proton-autogen/* /usr/share/proton-autogen/ || true

          mkdir -p /usr/lib/python3.*/site-packages/proton_autogen
          cp -r usr/lib/python3/dist-packages/proton_autogen \
            /usr/lib/python3.*/site-packages/

      - name: Run gamescope tests only
        run: |
          export PYTHONPATH=/usr/lib/python3.*/site-packages
          export PATH=/usr/bin:$PATH
          python -m pytest tests/test_gamescope.py -v

      - name: Run tests
        run: |
          export PYTHONPATH=/usr/lib/python3.*/site-packages
          export PATH=/usr/bin:$PATH
          python3 -m pytest -v
