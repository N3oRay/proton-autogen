name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system dependencies (GTK / GI)
        run: |
          sudo apt update
          sudo apt install -y \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-4.0 \
            libgirepository1.0-dev \
            gtk-4 \
            glib-2.0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pyyaml

      - name: Setup project paths
        run: |
          echo "PYTHONPATH=$GITHUB_WORKSPACE/usr/lib/python3/dist-packages" >> $GITHUB_ENV
          echo "$GITHUB_WORKSPACE/usr/bin" >> $GITHUB_PATH
          chmod +x usr/bin/proton-autogen

      - name: Run unit tests
        run: |
          pytest -v \
            --cov=proton_autogen \
            --cov-report=term-missing
