[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proton-autogen"
version = "3.1.3"
description = "Automatic Proton/Wine launcher"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "N3oRay" }
]
dependencies = [
  "pyyaml",
  "pygobject",
  "rich"
]

[tool.setuptools.package-dir]
proton_autogen = "usr/lib/python3/dist-packages/proton_autogen"

[tool.setuptools.packages.find]
where = ["usr/lib/python3/dist-packages"]
include = ["proton_autogen*"]
namespaces = false
